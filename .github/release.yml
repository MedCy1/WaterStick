# GitHub Native Release Notes Generator Configuration
changelog:
  categories:
    - title: "Features & Enhancements"
      labels:
        - "feature"
        - "enhancement"
      keywords:
        - "feat"
        - "feature"
    - title: "Performance & Hardware Optimizations"
      labels:
        - "performance"
        - "optimization"
      keywords:
        - "perf"
        - "tweak"
    - title: "Bug Fixes"
      labels:
        - "fix"
        - "bug"
      keywords:
        - "fix"
    - title: "Safety & Architecture"
      labels:
        - "security"
        - "refactor"
      keywords:
        - "refactor"
        - "sec"
    - title: "Documentation"
      labels:
        - "documentation"
      keywords:
        - "docs"
    - title: "Build & Automation"
      labels:
        - "ci"
        - "build"
      keywords:
        - "build"
        - "ci"
        - "chore"
