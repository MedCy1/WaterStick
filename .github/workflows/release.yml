name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run Tests and Code Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -v -race -coverprofile=coverage.txt ./...

  release:
    name: Build, Package and Release
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip header --latest
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Cross-compile and Package Artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIST_DIR="dist_release"
          mkdir -p "$DIST_DIR"

          targets=(
            "linux/amd64/tar.gz"
            "linux/arm64/tar.gz"
            "darwin/amd64/tar.gz"
            "darwin/arm64/tar.gz"
            "windows/amd64/zip"
          )

          for item in "${targets[@]}"; do
            IFS="/" read -r os arch format <<< "$item"
            echo "Building for ${os}/${arch}..."

            STAGE_DIR="stage_${os}_${arch}"
            mkdir -p "$STAGE_DIR"

            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" \
              -o "${STAGE_DIR}/waterstick${ext}" \
              ./cmd/waterstick

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" \
              -o "${STAGE_DIR}/waterstick-tui${ext}" \
              ./cmd/waterstick-tui

            cp README.md "${STAGE_DIR}/"
            cp LICENSE "${STAGE_DIR}/"

            if [ "$os" = "windows" ]; then
              sudo apt-get update && sudo apt-get install -y nsis
              cp packaging/windows/installer.nsi "$STAGE_DIR/"
              (cd "$STAGE_DIR" && makensis -DAPP_VERSION="${TAG#v}" installer.nsi)
              mv "${STAGE_DIR}/waterstick-setup-${TAG#v}-windows-amd64.exe" "${DIST_DIR}/"
            fi

            ARCHIVE_NAME="waterstick_${TAG}_${os}_${arch}"
            if [ "$format" = "zip" ]; then
              (cd "$STAGE_DIR" && zip -9 -r "../${DIST_DIR}/${ARCHIVE_NAME}.zip" . -x "*.nsi")
            else
              tar -czvf "${DIST_DIR}/${ARCHIVE_NAME}.tar.gz" -C "$STAGE_DIR" .
            fi

            rm -rf "$STAGE_DIR"
          done

          cd "$DIST_DIR"
          sha256sum *.tar.gz *.zip *.exe > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist_release/*.tar.gz
            dist_release/*.zip
            dist_release/*.exe
            dist_release/checksums.txt
          draft: false
          prerelease: false
