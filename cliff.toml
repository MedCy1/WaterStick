# Configuration file for git-cliff (https://git-cliff.org)

[changelog]
header = """
# Release Notes

All notable changes to WaterStick are documented in this release.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- Generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat\\(core\\)", group = "Core Engine" },
    { message = "^feat\\(tui\\)", group = "Terminal Interface (TUI)" },
    { message = "^feat\\(gui\\)", group = "Desktop Interface (GUI)" },
    { message = "^feat\\(cli\\)", group = "Command-Line Interface (CLI)" },
    { message = "^feat\\(data\\)", group = "Packages & Sideload Catalog" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance & Tweaks" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling & UI Polish" },
    { message = "^docs", group = "Documentation" },
    { message = "^build", group = "Build System & Packaging" },
    { message = "^ci", group = "CI/CD & Workflows" },
    { message = "(?i)^first commit", skip = true },
    { message = "(?i)^initial commit", skip = true },
    { message = ".*", group = "Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
